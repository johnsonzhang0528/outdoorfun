name: Daily System Maintenance

on:
  schedule:
    # 每天台灣時間凌晨 2:00 (UTC 18:00) 觸發
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r py/requirements.txt

      - name: Check Schedule
        id: check_schedule
        run: |
          # UTC 18:00 Sunday is Monday 02:00 Taiwan (Weekly Update Time)
          # date +%u returns 7 for Sunday
          echo "is_weekly_update=$(if [ $(date +%u) -eq 7 ]; then echo 'true'; else echo 'false'; fi)" >> $GITHUB_OUTPUT

      - name: Run Weekly AI Product Generation
        if: steps.check_schedule.outputs.is_weekly_update == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 每週一執行重型 AI 任務 (生成商品推薦)
          python py/generate_surf_products.py

      - name: Run Daily Data Pipeline
        run: |
          # 1. 每日更新天氣/浪況 (最重要)
          python py/fetch_sea_conditions.py
          
          # 2. 每日生成自己的推廣 Feed (讓夥伴網站抓最新的)
          python py/generate_cross_promo_data.py

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Stage specific generated files
          git add src/data/sea_conditions.json
          git add public/feeds/top_spots.json
          
          # Only add products if it exists/changed (Weekly)
          git add src/data/products.json

          # Check if there are changes to commit
          if [[ -n $(git status -s) ]]; then
            git commit -m "chore(data): daily system update (weather/feed)"
            git push
          else
            # Daily trigger for Vercel (Force Rebuild to refresh ISR/SSG if needed)
            echo "No data changes. Triggering daily deploy."
            git commit --allow-empty -m "chore(deploy): daily release trigger"
            git push
          fi
