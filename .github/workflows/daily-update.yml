name: Daily System Maintenance

on:
  schedule:
    # 每天台灣時間凌晨 2 點 (UTC 18:00) 觸發
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r py/requirements.txt

      - name: Check Schedule
        id: check_schedule
        run: |
          # UTC 18:00 Sunday is Monday 02:00 Taiwan (Weekly Update Time)
          # date +%u returns 7 for Sunday
          echo "is_weekly_update=$(if [ $(date +%u) -eq 7 ]; then echo 'true'; else echo 'false'; fi)" >> $GITHUB_OUTPUT

      - name: Run Daily Data Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 使用新的整合 Pipeline，一次執行所有 ETL 任務
          # 包含：抓天氣、同步露營資料、生成商品推薦、生成互惠 Feed
          python py/update_pipeline.py

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Stage specific generated files
          git add src/data/sea_conditions.json
          git add src/data/top_camps.json
          git add src/data/products.json
          git add public/feeds/top_spots.json

          # Check if there are changes to commit
          if [[ -n $(git status -s) ]]; then
            git commit -m "chore(data): daily update (weather, inventory, promo)"
            git push
          else
            # Daily trigger for Vercel (Force Rebuild to refresh ISR/SSG if needed)
            echo "No data changes. Triggering daily deploy."
            git commit --allow-empty -m "chore(deploy): daily release trigger"
            git push
          fi
